[package]
name = "furnigen-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Browser FFI surface for FurniGen (wasm-bindgen + wasm-pack)"

[lib]
# `rlib` keeps `cargo test` / `cargo clippy` on the host target working; `cdylib` is what wasm-pack links for `wasm32-unknown-unknown`.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Optional: better panic messages in the browser console during development.
debug-panic-hook = ["dep:console_error_panic_hook"]

[dependencies]
console_error_panic_hook = { version = "0.1.7", optional = true }
furnigen-core = { path = "../furnigen-core" }
serde_json = "1.0"
wasm-bindgen = "0.2"
